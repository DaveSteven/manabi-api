limit_req_zone $binary_remote_addr zone=manabi_login:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://@DOMAIN@$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location = /api/v1/auth/login {
        limit_req zone=manabi_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/manabi-proxy.conf;
    }
    location = /api/v1/auth/register { return 403; }
    location = /api/v1/auth/upgrade { return 403; }
    location = /api/v1/auth/guest { return 404; }
    location / { include /etc/nginx/manabi-proxy.conf; }
}
